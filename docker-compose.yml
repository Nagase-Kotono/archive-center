# Archive Center 단일 스택 (Go 백엔드 + MariaDB + ChromaDB).
# 실행: cp .env.docker.example .env → 값 채우고 → docker compose up -d --build
# 이 포크 운영용 파일 (원본 레포엔 없음).
#
# ★ 리수(PocketRisu) 연동 구조:
#   리수 플러그인은 브라우저 CSP 때문에 리수 서버를 프록시 경유해서 백엔드를 호출하고,
#   그 프록시 대상이 리수 컨테이너 자신의 127.0.0.1:28080 이에요.
#   그래서 ac 서비스들을 리수와 같은 network namespace(tailscale sidecar)에 붙여서
#   127.0.0.1:28080 / 3306 / 8000 으로 통신해요. 포트는 호스트에 노출하지 않아요.
#   전제: pocketrisu-ts 컨테이너가 먼저 실행 중이어야 함.
name: archive-center

services:
  # 정본 저장소 (MariaDB). 001_schema.sql을 initdb.d에 넣어 최초 기동 때 자동 스키마.
  # 주의: initdb.d는 빈 볼륨 최초 1회만 실행. 스키마 변경 시 수동 마이그레이션 필요 (DOCKER.md 참고).
  ac-mariadb:
    image: mariadb:11.8          # 패치까지 핀 (재현성).
    container_name: ac-mariadb
    restart: unless-stopped
    network_mode: "container:pocketrisu-ts"   # 리수 namespace 공유 → 3306을 리수와 공유
    environment:
      MARIADB_DATABASE: archive_center
      MARIADB_USER: ac_user
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?set MARIADB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set MARIADB_ROOT_PASSWORD in .env}
    volumes:
      - /Volumes/Nagase_K/archive-center/mariadb:/var/lib/mysql
      - ./migrations/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 2g                # 환경 맞게 조정
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # 벡터 검색 가속기 (ChromaDB). 1.5.9는 /data 에 자동 persist.
  ac-chroma:
    image: chromadb/chroma:1.5.9
    container_name: ac-chroma
    restart: unless-stopped
    network_mode: "container:pocketrisu-ts"   # 8000을 리수와 공유
    environment:
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - /Volumes/Nagase_K/archive-center/chroma:/data
    healthcheck:
      # 이미지에 curl/wget/python 없고 bash만 있음. bash /dev/tcp 로 8000 포트 리슨 확인.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8000"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 2g
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Go 백엔드. 리수 namespace 안에서 127.0.0.1:28080 리슨 → 리수 프록시가 접근.
  ac-go:
    build:
      context: .
      dockerfile: Dockerfile
    image: archive-center-kotono:local
    container_name: ac-go
    restart: unless-stopped
    network_mode: "container:pocketrisu-ts"   # 리수와 같은 namespace → 프록시 127.0.0.1:28080 도달
    environment:
      AC_BUILD_VERSION: "3.5.0"
      # namespace loopback 에만 바인드 (외부 노출 없음, 리수 프록시만 접근).
      AC_BIND_ADDR: "127.0.0.1:28080"
      # live + mariadb_authority = 실제 영속 저장. 같은 namespace라 DB/Chroma도 127.0.0.1.
      AC_MODE: "live"
      AC_STORE_MODE: "mariadb_authority"
      AC_MARIADB_DSN: "ac_user:${MARIADB_PASSWORD}@tcp(127.0.0.1:3306)/archive_center?parseTime=true&charset=utf8mb4&collation=utf8mb4_unicode_ci&loc=UTC"
      AC_CHROMA_ENDPOINT: "http://127.0.0.1:8000"
      AC_CHROMA_API_PATH: "/api/v2"
      # namespace 내부 localhost 통신이라 리수만 접근 → 인증 불필요.
      AC_ENFORCE_AUTH: "false"
      AC_UPDATE_ENABLED: "false"
      AC_ALLOWED_ORIGINS: "*"
    volumes:
      # 프롬프트 편집 UI용 host 바인드 (편집분 유지). 소유권 65532(nonroot).
      - /Volumes/Nagase_K/archive-center/prompts:/app/prompts
    depends_on:
      ac-mariadb:
        condition: service_healthy
      ac-chroma:
        condition: service_healthy
    mem_limit: 512m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
